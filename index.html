function escapeInvoiceText(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function updateCartName(i,name){
    var p=(db.products||[]).find(function(x){return String(x.name||'').toLowerCase()===String(name||'').trim().toLowerCase();});
    if(!p){alert('اختر صنفاً مسجلاً في المخزون');renderSaleModalContent();return;}
    var c=db.cart[i];if(!c)return;
    c.id=p.id;c.name=p.name;c.barcode=p.barcode||'';c.unit='حبة';c.qty=Number(c.qty||1);c.sell=Number(p.sell||0);c.baseQty=c.qty;
    renderSaleModalContent();
}
function updateSaleLineTotal(i,value){
    var c=db.cart[i];if(!c)return;var total=Number(value),qty=Number(c.qty||0);
    if(!isFinite(total)||total<0||qty<=0)return alert('قيمة إجمالي الصنف غير صحيحة');
    c.sell=total/qty;renderSaleModalContent();
}
function setSaleFinalTotal(value){
    var subtotal=(db.cart||[]).reduce(function(a,x){return a+Number(x.sell||0)*Number(x.qty||0);},0);
    var finalValue=Number(value);
    if(!isFinite(finalValue)||finalValue<0||finalValue>subtotal){alert('الصافي يجب أن يكون بين صفر والمجموع');renderSaleModalContent();return;}
    var d=document.getElementById('saleDiscount');if(d)d.value=subtotal-finalValue;
    renderSaleTotalsOnly();
}

function focusInvoiceItem(index) {
    var cards = document.querySelectorAll('.invoice-line');
    if(cards[index]) { cards[index].scrollIntoView({behavior:'smooth',block:'center'}); cards[index].classList.add('invoice-line-selected'); }
}
function renderSaleTotalsOnly() {
    var subtotal=(db.cart||[]).reduce(function(sum,item){return sum+Number(item.sell||0)*Number(item.qty||0);},0);
    var discount=Number(document.getElementById('saleDiscount')?document.getElementById('saleDiscount').value:0);
    var a=document.getElementById('invoiceSubtotal'),b=document.getElementById('saleFinalTotal'),q=document.getElementById('invoiceQtyTotal');
    if(a)a.value=subtotal;if(b)b.value=Math.max(0,subtotal-discount);
    if(q)q.textContent=String((db.cart||[]).reduce(function(n,x){return n+Number(x.qty||0);},0));
}
function updateCartSell(i, val) {
    if(!db.cart[i]) return;
    var price = Number(val);
    if(!isFinite(price) || price < 0) return alert('أدخل سعر بيع صحيحاً');
    db.cart[i].sell = price;
    renderSaleModalContent();
}

function updateCartQty(i, val) {
    var q = Number(val);
    if(!isFinite(q) || q <= 0) return alert('أدخل كمية صحيحة');
    var c=db.cart[i]; if(!c) return;
    c.qty=q;
    var p=db.products.find(function(x){return x.id===c.id;})||{};
    c.baseQty=q*(c.unit==='حبة'?1:Math.max(1,Number(p.packSize||1)));
    renderSaleModalContent();
}
function updateCartUnit(i, unit) {
    var c=db.cart[i]; if(!c) return;
    var p=db.products.find(function(x){return x.id===c.id;})||{};
    var factor=unit==='حبة'?1:Math.max(1,Number(p.packSize||1));
    c.unit=unit;
    c.sell=unit==='حبة'?Number(p.sell||c.sell||0):Number(p.packSell||(Number(p.sell||c.sell||0)*factor));
    c.baseQty=Number(c.qty||1)*factor;
    renderSaleModalContent();
}
function removeSaleCart(i) { db.cart.splice(i, 1); renderSaleModalContent(); }

function renderSaleProductSuggestions(query) {
    var box = document.getElementById('saleProductSuggestions');
    if(!box) return;
    query = String(query || '').trim().toLocaleLowerCase();
    if(!query) { box.style.display='none'; box.innerHTML=''; return; }
    var terms=query.split(/\s+/).filter(Boolean);
    var matches = (db.products||[]).filter(function(p){
        var searchable=(String(p.name||'')+' '+String(p.barcode||'')).toLocaleLowerCase();
        return terms.every(function(term){return searchable.indexOf(term)!==-1;});
    });
    if(!matches.length) { box.style.display='none'; box.innerHTML=''; return; }
    box.innerHTML = matches.map(function(p){
        var safeName = String(p.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var encoded = encodeURIComponent(String(p.name||''));
        return '<button type="button" style="display:block;width:100%;text-align:right;background:#fff;border:0;border-bottom:1px solid #e2e8f0;padding:12px;font-size:16px;font-weight:700;color:#1e293b" onclick="addModalItemByBarcode(decodeURIComponent(\''+encoded+'\'))">'+safeName+' <span style="color:#0f766e;font-size:12px">— '+money(p.sell||0)+'</span></button>';
    }).join('');
    box.style.display='block';
}

function addModalItemByBarcode(code) {
    code = (code || '').trim();
    if(!code) return;
    var normalizedCode = String(code || '').trim().toLocaleLowerCase();
    var p = db.products.find(function(x){ return String(x.barcode || '').trim().toLocaleLowerCase() === normalizedCode; }) ||
            db.products.find(function(x){ return String(x.name || '').trim().toLocaleLowerCase() === normalizedCode; });
    if(!p){var matches=(db.products||[]).filter(function(x){return String(x.name||'').toLocaleLowerCase().indexOf(normalizedCode)>-1||String(x.barcode||'').toLocaleLowerCase().indexOf(normalizedCode)>-1;});if(matches.length>1){renderSaleProductSuggestions(code);return;}if(matches.length===1)p=matches[0];}
    if(!p) { toast('لا يوجد صنف مطابق في المخزون'); return; }
    var item = db.cart.find(function(x){ return x.id === p.id; });
    if(item) { item.qty += 1; item.baseQty = item.qty * (item.unit === 'حبة' ? 1 : Math.max(1,Number(p.packSize||1))); }
    else db.cart.push({ id: p.id, name: p.name, barcode: p.barcode, sell: Number(p.sell||0), qty: 1, unit: 'حبة', baseQty: 1, expiry: p.expiry });
    renderSaleModalContent();
    document.getElementById('saleBarcodeInp').value = '';
    toast('تمت الإضافة');
}

function saveSaleAndContinue(mode){
    if(!db.cart||!db.cart.length){
        if(mode==='back'){closeModal();show(window.saleReturnView||'home');}
        else {db.cart=[];renderSaleModalContent();}
        return;
    }
    checkoutSale(mode==='back'?'back':mode==='new'?'new':'stay');
}
function checkoutSale(printMode) {
    if(!db.cart || db.cart.length === 0) return toast('السلة فارغة!');
    var saleType = document.getElementById('saleType').value;
    var customerName = document.getElementById('saleCustomer').value.trim() || (saleType === 'آجل' ? 'زبون آجل' : 'نقدي');
    var invoiceDateValue=document.getElementById('saleInvoiceDate')?document.getElementById('saleInvoiceDate').value:'';
    var saleDateValue=invoiceDateValue?new Date(invoiceDateValue+'T12:00:00').toISOString():new Date().toISOString();
    var discount = Number(document.getElementById('saleDiscount').value || 0);
    
    var subtotal = 0;
    for(var i=0; i<db.cart.length; i++) subtotal += (db.cart[i].sell * db.cart[i].qty);

    if (discount < 0 || discount > subtotal) {
        alert('تحقق من مبلغ الخصم؛ يجب أن يكون بين صفر وإجمالي الفاتورة.');
        return;
    }
    for (var stockIdx = 0; stockIdx < db.cart.length; stockIdx++) {
        var stockItem = db.cart[stockIdx];
        var stockProduct = db.products.find(function(x){ return x.id === stockItem.id; });
        var stockBaseNeeded = Number(stockItem.baseQty || (stockItem.qty * (stockItem.unit === (stockProduct && stockProduct.packType || 'كرتون') ? Number(stockProduct && stockProduct.packSize || 1) : 1)));
        var oldSaleQtyAvailable=0;
        if(editingSaleId) {
            var priorSale=(db.sales||[]).find(function(s){return s.id===editingSaleId;});
            var priorItem=priorSale && (priorSale.items||[]).find(function(it){return it.id===stockItem.id;});
            if(priorItem) oldSaleQtyAvailable=Number(priorItem.baseQty || (priorItem.qty*(priorItem.unit===(stockProduct && stockProduct.packType||'كرتون')?Number(stockProduct && stockProduct.packSize||1):1)));
        }
        if (!stockProduct || stockBaseNeeded > Number(stockProduct.qty || 0) + oldSaleQtyAvailable) {
            alert('الكمية المطلوبة من «' + stockItem.name + '» أكبر من المخزون المتاح.');
            return;
        }
    }
    if(!isManager) {
        var workerLimitPercent = Number(getCurrentWorker().discountLimitPercent===undefined?5:getCurrentWorker().discountLimitPercent);
        var maxAllowedDiscount = subtotal * workerLimitPercent / 100;
        if(discount > maxAllowedDiscount) {
            alert('عذراً، حد الخصم المحدد من المدير هو '+workerLimitPercent+'% (' + money(maxAllowedDiscount) + ')');
            return;
        }
    }

    if(saleType === 'آجل' && (!document.getElementById('saleCustomer').value.trim())) {
        alert('أدخل اسم الزبون للبيع الآجل');
        return;
    }
    
    var total = Math.max(0, subtotal - discount);
    
    if(editingSaleId) {
        var priorRecord=(db.sales||[]).find(function(s){return s.id===editingSaleId;});
        if(priorRecord) {
            (priorRecord.items||[]).forEach(function(oldIt){
                var oldProd=db.products.find(function(p){return p.id===oldIt.id;});
                if(oldProd) oldProd.qty=Number(oldProd.qty||0)+Number(oldIt.baseQty||(oldIt.qty*(oldIt.unit===(oldProd.packType||'كرتون')?Number(oldProd.packSize||1):1)));
            });
            if(priorRecord.type==='آجل') {
                var oldDebt=(db.debts||[]).find(function(d){return String(d.customer||'').toLowerCase()===String(priorRecord.customer||'').toLowerCase();});
                if(oldDebt) oldDebt.remaining=Math.max(0,Number(oldDebt.remaining||0)-Number(priorRecord.total||0));
            }
            db.sales=db.sales.filter(function(s){return s.id!==editingSaleId;});
        }
    }
    for(var i=0; i<db.cart.length; i++) {
        var prod = db.products.find(function(x){ return x.id === db.cart[i].id; });
        if(prod) prod.qty = Math.max(0, prod.qty - Number(db.cart[i].baseQty || (db.cart[i].qty * (db.cart[i].unit === (prod.packType||'كرتون') ? Number(prod.packSize||1) : 1))));
    }
    
    if(!db.sales) db.sales = [];
    var currentCartCopy = JSON.parse(JSON.stringify(db.cart));
    
    db.sales.push({ 
        id: Date.now(), 
        date: saleDateValue, 
        type: saleType, 
        customer: customerName, 
        worker: currentUser,
        items: currentCartCopy, 
        subtotal: subtotal, 
        discount: discount, 
        total: total 
    });
    
    if(!db.stockMovements) db.stockMovements = [];
    currentCartCopy.forEach(function(it){ db.stockMovements.push({id:Date.now()+Math.random(),date:new Date().toISOString(),kind:'بيع',item:it.name,qty:-Number(it.baseQty||it.qty||0),reference:'SALE-'+Date.now(),customer:customerName}); });
    if(saleType === 'آجل') {
        if(!db.debts) db.debts = [];
        var debtItem = db.debts.find(function(x){ return x.customer.toLowerCase() === customerName.toLowerCase(); });
        if(debtItem) debtItem.remaining += total;
        else db.debts.push({ id: Date.now(), customer: customerName, remaining: total });
    }
    
    db.cart = [];
    saveDB();
    
    if(printMode === 'pdf') {
        generateInvoicePDF(currentCartCopy, subtotal, discount, total, saleType, customerName, function() {
            closeModal();
            toast('تم حفظ الفاتورة وتصدير PDF!');
            show('home');
        });
    } else if(printMode === 'thermal') {
        generateThermalPrint(currentCartCopy, subtotal, discount, total, saleType, customerName);
        closeModal();
        toast('جاري إرسال الفاتورة للطباعة الحرارية...');
        show('home');
    } else if(printMode === 'new') {
        editingSaleId = null;
        db.cart = [];
        saveDB();
        toast('تم حفظ الفاتورة وفتح فاتورة جديدة');
        renderSaleModalContent();
        var customerInput=document.getElementById('saleCustomer'); if(customerInput) customerInput.value='';
        var discountInput=document.getElementById('saleDiscount'); if(discountInput) discountInput.value='0';
        var typeInput=document.getElementById('saleType'); if(typeInput) typeInput.value='نقد';
        var scanInput=document.getElementById('saleBarcodeInp'); if(scanInput) scanInput.focus();
    } else if(printMode === 'back') {
        editingSaleId = null;
        closeModal();
        toast('تم حفظ الفاتورة والعودة للقسم');
        show(window.saleReturnView || 'home');
    } else {
        closeModal();
        toast('تم إتمام الفاتورة بنجاح!');
        show(window.saleReturnView || 'home');
    }
}

function generateThermalPrint(cartItems, subtotal, discount, totalAmount, saleType, customerName) {
    var itemsListHtml = '';
    for(var i=0; i<cartItems.length; i++) {
        var c = cartItems[i];
        var sub = c.sell * c.qty;
        itemsListHtml += '<div style="display:flex; justify-content:space-between;"><span>' + c.name + ' (' + c.qty + ' ' + (c.unit||'حبة') + ')</span><span>' + sub + '</span></div>';
    }

    var thermalEl = document.getElementById('thermalPrintContainer');
    thermalEl.style.display = 'block';
    thermalEl.innerHTML = '<div style="text-align:center; font-weight:bold;">' + currentShop + '</div>' +
                        '<div style="text-align:center; font-size:10px;">فاتورة: ' + saleType + ' - الزبون: ' + customerName + '</div>' +
                        '<div style="border-bottom:1px dashed #000; margin:5px 0;"></div>' +
                        itemsListHtml +
                        '<div style="border-bottom:1px dashed #000; margin:5px 0;"></div>' +
                        '<div style="display:flex; justify-content:space-between;"><span>المجموع:</span><span>' + subtotal + '</span></div>' +
                        '<div style="display:flex; justify-content:space-between;"><span>الخصم:</span><span>' + discount + '</span></div>' +
                        '<div style="display:flex; justify-content:space-between; font-weight:bold;"><span>الصافي:</span><span>' + totalAmount + '</span></div>' +
                        '<div style="text-align:center; margin-top:10px; font-size:9px;">شكراً لزيارتكم!</div>';
    window.print();
    setTimeout(function(){ thermalEl.style.display = 'none'; }, 1000);
}

function deleteSaleInvoice(id) {
    if(!isManager) return alert('حذف فواتير البيع خاص بالمدير');
    var sale=(db.sales||[]).find(function(s){return String(s.id)===String(id);});
    if(!sale) return alert('فاتورة البيع غير موجودة');
    if(!confirm('هل تريد حذف فاتورة البيع؟ سيتم إرجاع الأصناف إلى المخزون وتعديل حساب العميل إن كانت آجلة.')) return;
    (sale.items||[]).forEach(function(it){
        var prod=db.products.find(function(p){return p.id===it.id || p.name===it.name;});
        if(prod) prod.qty=Number(prod.qty||0)+Number(it.baseQty||(it.qty*(it.unit===(prod.packType||'كرتون')?Number(prod.packSize||1):1)));
    });
    if(sale.type==='آجل') {
        var debt=(db.debts||[]).find(function(d){return String(d.customer||'').toLowerCase()===String(sale.customer||'').toLowerCase();});
        if(debt) debt.remaining=Math.max(0,Number(debt.remaining||0)-Number(sale.total||0));
    }
    db.sales=db.sales.filter(function(s){return String(s.id)!==String(id);});
    saveDB();show('sales');toast('تم حذف فاتورة البيع وإرجاع الكميات للمخزون');
}

function generateInvoicePDF(cartItems, subtotal, discount, totalAmount, saleType, customerName, callback) {
    var itemsListHtml = '';
    for(var i=0; i<cartItems.length; i++) {
        var c = cartItems[i];
        var sub = c.sell * c.qty;
        itemsListHtml += '<tr><td style="padding:6px; border-bottom:1px solid #ddd">' + c.name + '</td><td style="padding:6px; border-bottom:1px solid #ddd; text-align:center">' + c.qty + ' ' + (c.unit||'حبة') + '</td><td style="padding:6px; border-bottom:1px solid #ddd; text-align:left">' + money(sub) + '</td></tr>';
    }

    var pdfEl = document.getElementById('pdfInvoiceContainer');
    pdfEl.style.display = 'block';
    pdfEl.innerHTML = '<h2 style="text-align:center; color:#0f766e; margin-bottom:5px">🏪 ' + currentShop + '</h2>' +
                      '<p style="text-align:center; font-size:12px; color:#555; margin-top:0">فاتورة (' + saleType + ') - العميل: ' + customerName + ' (بواسطة: ' + currentUser + ')</p>' +
                      '<table style="width:100%; border-collapse:collapse; font-size:13px">' +
                      '<tr><th style="text-align:right; padding:6px; border-bottom:2px solid #0f766e">المنتج</th><th style="padding:6px; border-bottom:2px solid #0f766e">الكمية</th><th style="padding:6px; border-bottom:2px solid #0f766e">الإجمالي</th></tr>' +
                      itemsListHtml + '</table>' +
                      '<div style="margin-top:15px; font-size:13px; border-top:1px solid #ddd; padding-top:8px;">' +
                      '<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>المجموع:</span><span>' + money(subtotal) + '</span></div>' +
                      '<div style="display:flex; justify-content:space-between; margin-bottom:4px; color:#b91c1c;"><span>الخصم:</span><span>- ' + money(discount) + '</span></div>' +
                      '<h3 style="text-align:left; color:#17202a; margin:8px 0 0 0">الإجمالي النهائي: ' + money(totalAmount) + '</h3>' +
                      '</div>';

    var opt = { margin: 0.5, filename: 'Invoice_' + Date.now() + '.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
    html2pdf().set(opt).from(pdfEl).save().then(function() { pdfEl.style.display = 'none'; if(callback) callback(); });
}

function payDebt(id) {
    var d = db.debts.find(function(x){ return x.id === id; });
    if(!d) return;
    var amount = Number(prompt('أدخل مبلغ السداد للعميل ' + d.customer + ' (المتبقي: ' + d.remaining + '):', d.remaining));
    if(!amount || amount <= 0) return;
    
    d.remaining = Math.max(0, d.remaining - amount);
    
    if(!db.payments) db.payments = [];
    db.payments.push({
        id: Date.now(),
        debtId: d.id,
        customer: d.customer,
        amount: amount,
        date: new Date().toISOString()
    });

    if(d.remaining <= 0) {
        db.debts = db.debts.filter(function(x){ return x.id !== id; });
    }
    
    saveDB(); 
    show('debts'); 
    toast('تم تسجيل سداد الدين وإضافته للخزينة اليومية');
}

function startCameraScanner(targetInputId) {
    activeScannerTargetInputId = targetInputId;
    document.getElementById('barcodeModal').style.display = 'flex';
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, function(text) {
        stopCameraScanner();
        if(activeScannerTargetInputId === 'saleBarcodeInp') addModalItemByBarcode(text);
        else if(activeScannerTargetInputId === 'purItemBarcode') { var purBarEl = document.getElementById('purItemBarcode'); if(purBarEl) purBarEl.value = text; lookupPurchaseBarcode(text); }
        else { var el = document.getElementById(activeScannerTargetInputId); if(el) { el.value = text; if(activeScannerTargetInputId === 'stockSearch') renderStock(text); } }
        toast('تم المسح: ' + text);
    }, function(){}).catch(function(){ stopCameraScanner(); });
}

function stopCameraScanner() {
    if(html5QrCode) { html5QrCode.stop().then(function(){ html5QrCode.clear(); html5QrCode = null; }).catch(function(){ html5QrCode = null; }); }
    document.getElementById('barcodeModal').style.display = 'none';
}

function closeModal() { document.getElementById('modal').innerHTML = ''; }

// تسجيل Service Worker من ملف مستقل (يتطلب HTTPS أو localhost؛ لا يعمل من file://)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
            console.warn('تعذر تسجيل وضع عدم الاتصال:', err);
        });
    });
}

// يعمل هذا المسار حتى إذا تعذر تحميل مكتبة Firebase أثناء فتح التطبيق بلا إنترنت.
if (!window.cloudReady) {
    cloudMetadataLoaded = true;
    checkStoredSession();
}
