<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #f5f7f8; color: #17202a; }
button, input, select, textarea { font: inherit; }
button { border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.app { max-width: 900px; margin: auto; min-height: 100vh; background: #f5f7f8; }
.top { position: sticky; top: 0; z-index: 5; background: #0f766e; color: #fff; padding: 16px; box-shadow: 0 2px 12px #0002; }
.brand { display: flex; justify-content: space-between; align-items: center; }
.brand h1 { font-size: 21px; margin: 0; }
.sub { font-size: 12px; opacity: .8; }
.content { padding: 14px 14px 90px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 8; max-width: 900px; margin: auto; background: #fff; border-top: 1px solid #ddd; display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px; }
.nav button { background: none; color: #59636d; font-size: 14px; padding: 10px 2px; font-weight: 600; line-height: 1.25; }
.nav button.active { color: #0f766e; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { background: #fff; border: 1px solid #e3e7e9; border-radius: 16px; padding: 14px; box-shadow: 0 2px 8px #00000008; }
.stat { font-size: 22px; font-weight: 800; margin-top: 4px; }
.muted { color: #68737d; font-size: 12px; }
.section { margin: 14px 0 9px; font-weight: 800; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.input { width: 100%; padding: 12px; border: 1px solid #d8dee2; border-radius: 12px; background: #fff; outline: none; }
.primary { background: #0f766e; color: #fff; }
.dark { background: #17202a; color: #fff; }
.danger { background: #fee2e2; color: #b91c1c; }
.light { background: #e9f5f3; color: #0f766e; }
.products { display: grid; gap: 8px; }
.product { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 12px; border: 1px solid #e2e6e8; border-radius: 14px; }

.sale-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 10px; }
.sale-sheet { background: #fff; width: 100%; max-width: 650px; border-radius: 20px; padding: 20px; max-height: 95vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

.toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: #17202a; color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 999999; font-size: 13px; }
.login-bg { position: fixed; inset: 0; background: #0f766e; z-index: 90000; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y:auto; }
.box-panel { width: 100%; max-width: 400px; background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 8px 30px #0004; margin:auto; }
.box-title { text-align: center; font-size: 28px; font-weight: 900; color: #0f766e; margin: 0 0 20px; user-select: none; }
.box-label { display: block; font-weight: 800; margin: 10px 0 6px; color: #17202a; }
.msg-box { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; font-size: 14px; }
.link-text { color: #0f766e; text-align: center; margin-top: 15px; font-weight: bold; cursor: pointer; display: block; text-decoration: underline; }
.bank-info { background: #f5f7f8; border: 1px dashed #0f766e; padding: 12px; border-radius: 10px; text-align: center; margin: 15px 0; }
.offline-note { background: #e9f5f3; border: 1px dashed #0f766e; color: #0f766e; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 15px; }



/* فاتورة مبيعات بملء الشاشة */
.invoice-fullscreen{position:fixed;inset:0;padding:0;background:#eaf0f6;z-index:100000;display:block;overflow:auto}
.invoice-sheet{width:100%;max-width:none;height:100%;max-height:none;min-height:100vh;border:0;border-radius:0;padding:clamp(12px,2vw,26px);overflow:auto;box-shadow:none;background:#f8fafc}
.invoice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid #dbe4ed}
.invoice-kicker{font-size:12px;color:#64748b;font-weight:800}
.invoice-head h2{margin:3px 0;font-size:clamp(22px,3vw,30px);color:#123b63}
.invoice-customer-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:16px 0}
.invoice-customer-grid label,.invoice-bottom>label,.invoice-item-fields label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#334155}
.invoice-add-panel{background:#eaf1f8;border:1px solid #cfdae6;border-radius:12px;padding:14px;margin-bottom:14px}
.invoice-add-title{font-weight:900;color:#123b63;margin-bottom:8px}
.invoice-search-row{display:grid;grid-template-columns:minmax(160px,1fr) auto auto;gap:8px}
.invoice-suggestions{background:#fff;border:1px solid #cbd5e1;border-radius:10px;margin-top:8px;max-height:220px;overflow:auto}
.invoice-table-wrap{background:#fff;border:1px solid #dbe4ed;border-radius:12px;overflow:hidden}
.invoice-table-heading{display:flex;justify-content:space-between;background:#123b63;color:white;padding:12px 14px;font-weight:800}
.invoice-line{padding:12px 14px;border-bottom:1px solid #e2e8f0}
.invoice-item-name{display:block;background:transparent;color:#123b63;padding:2px 0 10px;font-size:17px;font-weight:900;text-align:right;border-radius:0}
.invoice-item-name:active{color:#0f766e}
.invoice-item-fields{display:grid;grid-template-columns:minmax(130px,1.2fr) minmax(90px,.6fr) minmax(110px,.7fr) minmax(110px,.7fr) auto;align-items:end;gap:10px}
.invoice-number{text-align:center;font-weight:800;font-size:17px}
.invoice-line-total{color:#123b63;text-align:center;padding:12px 2px}
.invoice-delete{padding:9px 12px}
.invoice-empty{text-align:center;color:#64748b;padding:38px 12px}
.invoice-line-selected{background:#eff6ff}
.invoice-bottom{display:grid;grid-template-columns:minmax(130px,.5fr) minmax(260px,1fr);gap:14px;align-items:end;margin:14px 0}
.invoice-totals{background:#eaf1f8;border:1px solid #cbd8e5;border-radius:12px;padding:12px 16px}
.invoice-totals>div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-weight:700}
.invoice-grand-total{font-size:clamp(22px,3vw,30px);color:#0f766e}
.invoice-actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding-bottom:10px}
.invoice-actions button{min-height:52px;font-weight:900}
@media(max-width:650px){
 .invoice-customer-grid{grid-template-columns:1fr}
 .invoice-search-row{grid-template-columns:1fr 1fr}
 .invoice-search-row input{grid-column:1/-1}
 .invoice-item-fields{grid-template-columns:1fr 1fr;gap:8px}
 .invoice-line-total{grid-column:1}
 .invoice-delete{grid-column:2}
 .invoice-bottom{grid-template-columns:1fr}
 .invoice-actions{grid-template-columns:1fr}
 .invoice-head h2{font-size:21px}
}

/* واجهة محاسبية احترافية مستوحاة من برامج المحاسبة المكتبية */
:root{--navy:#123b63;--navy2:#1b527f;--teal:#147d78;--paper:#f1f5f9;--line:#dbe4ed;--ink:#182536;--muted:#64748b}
body{background:var(--paper);color:var(--ink)}
.app{max-width:1240px;background:var(--paper)}
.top{background:linear-gradient(115deg,var(--navy),var(--navy2));padding:16px 20px}
.brand h1{font-size:22px;letter-spacing:.1px}
.sub{font-size:12px;opacity:.9;margin-top:5px}
.content{padding:18px 18px 100px}
.card,.product{border-color:var(--line);border-radius:13px;box-shadow:0 3px 12px #17324d0a}
.card{padding:16px}
.stat{font-size:clamp(19px,2.2vw,27px);color:var(--navy);overflow-wrap:anywhere}
.section{color:var(--navy);border-right:4px solid var(--teal);padding-right:10px;margin:20px 0 12px}
.primary{background:var(--navy)}
.primary:hover{background:#0d2d4c}
.light{background:#e4eef7;color:var(--navy)}
.input{border-color:#cbd5e1;border-radius:9px;min-height:44px}
.input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px #1b527f18}
.nav{max-width:1240px;border-top:1px solid var(--line);box-shadow:0 -5px 18px #0f172a0a;padding:7px 10px calc(7px + env(safe-area-inset-bottom));grid-template-columns:repeat(6,minmax(0,1fr))}
.nav button{font-size:13px;border-radius:9px}
.nav button.active{background:#e7eff7;color:var(--navy)}
.sale-sheet{border:1px solid var(--line);border-radius:16px}
.box-panel{border:1px solid var(--line);box-shadow:0 20px 60px #071a2e24}
.box-title{color:var(--navy)}
.offline-note{background:#e7f2f8;border-color:#b7d0e3;color:var(--navy)}
.toast{max-width:calc(100vw - 28px);text-align:center}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{left:50%;transform:translateX(-50%);right:auto;width:min(1240px,100%)}.content{padding-bottom:95px}}
@media(max-width:520px){.top{padding:12px}.brand h1{font-size:18px}.brand{gap:8px}.brand>div:last-child button{font-size:12px;padding:10px 8px}.content{padding:12px 10px 100px}.grid{gap:8px}.card{padding:12px}.stat{font-size:18px}.nav button{font-size:10px;padding:9px 0;white-space:nowrap}}

@media print {
  body * { visibility: hidden; }
  #thermalPrintContainer, #thermalPrintContainer * { visibility: visible; }
  #thermalPrintContainer { position: absolute; left: 0; top: 0; width: 58mm; padding: 0; margin: 0; font-size: 11px; }
}

@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);right:auto;width:900px}.content{padding-bottom:80px}}

/* واجهة موحدة للفواتير وفق أسلوب برامج المحاسبة المكتبية */
.invoice-fullscreen{position:fixed;inset:0;z-index:100000;display:block;overflow:auto;background:#e9eef4;padding:0}
.invoice-sheet{width:100%;max-width:none;min-height:100vh;max-height:none;margin:0;border:0;border-radius:0;padding:clamp(12px,2vw,28px);background:#f7f9fc;box-shadow:none;overflow:auto}
.invoice-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 0 16px;border-bottom:2px solid #d7e0ea}
.invoice-head h2{margin:4px 0;color:#173f68;font-size:clamp(22px,3vw,30px)}
.invoice-kicker{font-size:12px;font-weight:800;color:#718096}
.invoice-customer-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:16px 0}
.invoice-customer-grid label,.invoice-bottom>label,.invoice-item-fields label,.purchase-entry-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#334155}
.invoice-add-panel{padding:14px;background:#edf3f8;border:1px solid #d1dce7;border-radius:10px;margin:14px 0}
.invoice-add-title{font-weight:900;color:#173f68;margin-bottom:10px}
.invoice-search-row{display:grid;grid-template-columns:minmax(160px,1fr) auto auto;gap:8px}
.invoice-suggestions{background:#fff;border:1px solid #cbd5e1;border-radius:9px;margin-top:8px;max-height:220px;overflow:auto}
.invoice-table-wrap{background:white;border:1px solid #d4dee8;border-radius:10px;overflow:hidden}
.invoice-table-heading{display:flex;justify-content:space-between;align-items:center;background:#173f68;color:white;padding:12px 14px;font-weight:900}
.invoice-column-head{display:grid;grid-template-columns:minmax(170px,2fr) .8fr .7fr .9fr .9fr 64px;gap:8px;padding:10px 14px;background:#e3ebf3;color:#334155;font-size:12px;font-weight:900}
.invoice-line{padding:12px 14px;border-bottom:1px solid #e3e9ef}
.invoice-item-name{display:block;background:transparent;color:#173f68;padding:2px 0 10px;font-size:16px;font-weight:900;text-align:right;border-radius:0}
.invoice-item-fields{display:grid;grid-template-columns:minmax(100px,1fr) minmax(80px,.6fr) minmax(100px,.8fr) minmax(100px,.8fr) auto;align-items:end;gap:10px}
.invoice-number{text-align:center;font-weight:800}
.invoice-line-total{color:#173f68;text-align:center;padding:12px 2px}
.invoice-delete{padding:9px 12px}
.invoice-empty{text-align:center;color:#718096;padding:34px 12px}
.invoice-line-selected{background:#edf5ff}
.invoice-bottom{display:grid;grid-template-columns:minmax(180px,.65fr) minmax(260px,1fr);gap:14px;align-items:stretch;margin:14px 0}
.invoice-totals{background:#edf3f8;border:1px solid #d1dce7;border-radius:10px;padding:12px 16px}
.invoice-totals>div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-weight:800}
.invoice-grand-total{font-size:clamp(22px,3vw,30px);color:#147d78}
.invoice-actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding-bottom:12px}
.invoice-actions button{min-height:50px;font-weight:900;border-radius:8px}
.purchase-entry-grid{display:grid;grid-template-columns:1.1fr 1.5fr .7fr .8fr .7fr .9fr;gap:9px;align-items:end}
.purchase-entry-grid .row{gap:6px}
.purchase-entry-grid .row>*:first-child{min-width:0}
.purchase-add-button{margin-top:12px;min-height:46px;font-weight:900}
.sale-columns{grid-template-columns:minmax(160px,2fr) .7fr .7fr .9fr .9fr 64px}
.sale-columns+ #invoiceItemsList .invoice-line{display:block}
.sale-columns+ #invoiceItemsList .invoice-item-name{width:100%;padding:0 0 8px}
.sale-columns+ #invoiceItemsList .invoice-item-fields{grid-template-columns:minmax(100px,1fr) .7fr .9fr .9fr 64px}
.purchase-columns{grid-template-columns:minmax(160px,2fr) .7fr .7fr .9fr .9fr 64px}
.purchase-line{display:grid;grid-template-columns:minmax(160px,2fr) .7fr .7fr .9fr .9fr 64px;gap:8px;align-items:center}
.purchase-product-cell{min-width:0}.purchase-item-title{display:block;color:#173f68;overflow-wrap:anywhere}
.purchase-barcode{display:block;font-size:11px}
.purchase-payment-box{background:#edf3f8;border:1px solid #d1dce7;border-radius:10px;padding:12px}
.purchase-payment-buttons{display:flex;gap:8px}
.purchase-payment-buttons button{flex:1;background:#e2e8f0;color:#26384b;font-weight:900;border-radius:8px}
.purchase-payment-buttons button.selected{background:#173f68;color:white}
.purchase-actions{grid-template-columns:2fr 1fr}
@media(max-width:760px){
 .invoice-customer-grid{grid-template-columns:1fr}
 .purchase-entry-grid{grid-template-columns:1fr 1fr}
 .purchase-entry-grid .purchase-name-field{grid-column:1/-1}
 .invoice-column-head{display:none}
 .purchase-line{grid-template-columns:1fr 1fr;gap:7px;padding:12px}
 .sale-columns{display:none}
 .sale-columns+ #invoiceItemsList .invoice-item-fields{grid-template-columns:1fr 1fr;gap:8px}
 .purchase-product-cell{grid-column:1/-1}.purchase-item-title{font-size:16px}
 .purchase-barcode{grid-column:1/-1}
 .purchase-total{font-size:17px;color:#173f68}
 .invoice-item-fields{grid-template-columns:1fr 1fr;gap:8px}
 .invoice-bottom{grid-template-columns:1fr}
 .invoice-actions,.purchase-actions{grid-template-columns:1fr}
 .invoice-search-row{grid-template-columns:1fr 1fr}
 .invoice-search-row input{grid-column:1/-1}
 .invoice-head h2{font-size:21px}
}
@media(max-width:420px){.purchase-entry-grid{grid-template-columns:1fr}.purchase-entry-grid .purchase-name-field{grid-column:auto}.invoice-sheet{padding:10px}.invoice-head{align-items:flex-start}}


/* Invoice remains usable in portrait; desktop mode expands within the current screen. */
@media screen and (max-width:900px) and (orientation:landscape){

 body.desktop-mode .invoice-fullscreen{overflow:auto}
 body.desktop-mode .invoice-sheet{width:100%;min-width:760px;min-height:100vh;padding:12px 16px}
 body.desktop-mode .invoice-head{padding-bottom:8px}
 body.desktop-mode .invoice-customer-grid{grid-template-columns:1.5fr 1fr;margin:8px 0}
 body.desktop-mode .invoice-add-panel{margin:8px 0;padding:9px}
 body.desktop-mode .invoice-add-title{margin-bottom:6px}
 body.desktop-mode .invoice-search-row{grid-template-columns:minmax(220px,1fr) auto auto}
 body.desktop-mode .invoice-column-head, body.desktop-mode .purchase-columns{display:grid}
 body.desktop-mode .sale-columns{grid-template-columns:minmax(190px,2fr) .8fr .7fr .9fr .9fr 58px}
 body.desktop-mode .sale-columns+#invoiceItemsList .invoice-line{display:grid;grid-template-columns:minmax(190px,2fr) minmax(0,4fr);gap:8px;align-items:center}
 body.desktop-mode .sale-columns+#invoiceItemsList .invoice-item-name{grid-column:1;margin:0;padding:4px;text-align:right}
 body.desktop-mode .sale-columns+#invoiceItemsList .invoice-item-fields{grid-column:2;display:grid;grid-template-columns:.8fr .7fr .9fr .9fr 58px;gap:6px;align-items:center}
 body.desktop-mode .sale-columns+#invoiceItemsList .invoice-item-fields label{font-size:11px;gap:3px}
 body.desktop-mode .sale-columns+#invoiceItemsList .invoice-item-fields .input{padding:6px;min-height:34px}
 body.desktop-mode .invoice-bottom{grid-template-columns:180px 1fr;margin:8px 0}
 body.desktop-mode .invoice-actions{grid-template-columns:2fr 1fr 1fr;gap:8px}
 body.desktop-mode .invoice-actions button{min-height:40px}
 body.desktop-mode .purchase-entry-grid{grid-template-columns:1fr 1.5fr .65fr .7fr .65fr .8fr}
 body.desktop-mode .purchase-line{grid-template-columns:minmax(190px,2fr) .7fr .7fr .8fr .9fr 58px;padding:8px 12px}
 body.desktop-mode .purchase-product-cell{min-width:0}
 body.desktop-mode .purchase-actions{grid-template-columns:2fr 1fr}

}

/* تصميم فاتورة مكتبية قريب من مرجع Golden Acc */
.golden-invoice{background:#e7edf4!important;padding:8px!important;color:#17202a}
.golden-topbar{display:flex;align-items:center;gap:12px;min-height:48px;padding:5px 10px;background:#dfe8f1;border:1px solid #c5d1dc;flex-wrap:wrap;font-weight:800}
.golden-topbar strong{font-size:20px;color:#173f68;margin-left:auto}
.golden-topbar button{min-height:36px;padding:6px 12px}
.golden-info-grid{display:grid;grid-template-columns:190px 1fr;gap:10px;margin:8px 0;background:#eaf0f6}
.golden-side{display:grid;align-content:stretch;border:1px solid #cbd5df;background:#f4f7fa}
.golden-side label{padding:8px;text-align:center;border-bottom:1px solid #d5dee7;color:#536273;font-size:13px}
.golden-side strong{display:block;font-size:19px;color:#17202a;margin-top:5px}
.golden-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px;border:1px solid #cbd5df}
.golden-fields label{display:flex;flex-direction:column;gap:4px;font-weight:800;color:#3e4d5d;font-size:13px}
.golden-fields .input,.golden-entry-row .input,.golden-totals .input{border-radius:2px;min-height:34px;padding:5px 8px;background:#fff}
.golden-entry-row{display:flex;gap:7px;margin:8px 0;padding:7px;background:#e5edf5;border:1px solid #cbd5df}
.golden-entry-row input{flex:1}
.golden-entry-row button{border-radius:3px;min-height:34px;padding:5px 12px}
.golden-table-wrap{height:min(42vh,470px);min-height:220px;overflow:auto;border:2px solid #8998a7;background:#dce7f1}
.golden-table{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed;background:#fff}
.golden-table th{position:sticky;top:0;z-index:1;background:#f4f6f8;color:#263646;border:1px solid #aab5bf;padding:7px 6px;font-weight:900}
.golden-table td{border:1px solid #b4bec8;padding:3px 5px;background:#e4e4e4}
.golden-table tbody tr:nth-child(even) td{background:#f0ffff}
.golden-table th:first-child,.golden-table td:first-child{width:38px}
.golden-table th:nth-child(2){width:32%}
.golden-table th:nth-child(3){width:12%}
.golden-table th:nth-child(4){width:12%}
.golden-table th:nth-child(5){width:14%}
.golden-table th:nth-child(6){width:16%}
.golden-table th:nth-child(7){width:12%}
.grid-edit{width:100%;min-width:0;min-height:34px;padding:4px 6px!important;border-radius:0!important;border:1px solid transparent!important;background:transparent!important;text-align:center}
.grid-edit:focus{background:#fff!important;border:1px solid #2785c7!important;outline:1px solid #2785c7}

<script>
var usersList = [];
var pendingRequests = [];
try { usersList = JSON.parse(localStorage.getItem('pos_users_cache') || '[]'); } catch(e) { usersList = []; }
try { pendingRequests = JSON.parse(localStorage.getItem('pos_pending_cache') || '[]'); } catch(e) { pendingRequests = []; }
var currentShop = '';
var currentUser = '';
var isManager = true;
var db = null;
var html5QrCode = null;
var activeScannerTargetInputId = null;

function getCurrentWorker(){
    return (!isManager && db && Array.isArray(db.workers)) ? (db.workers.find(function(w){return String(w.u||'').toLowerCase()===String(currentUser||'').toLowerCase();}) || {}) : {};
}
function hasWorkerPermission(permission){
    if(isManager) return true;
    var worker=getCurrentWorker();
    return !!(worker.permissions && worker.permissions[permission]===true);
}
function requirePermission(permission, message){
    if(isManager || hasWorkerPermission(permission)) return true;
    alert(message || 'هذا الإجراء غير مسموح لحساب العامل. راجع المدير.');
    return false;
}


function checkDeviceTimeTampering() {
    var lastValidTime = localStorage.getItem('pos_last_trusted_time');
    var deviceCurrentTime = new Date().getTime();

    if (lastValidTime) {
        if (deviceCurrentTime < Number(lastValidTime)) {
            document.body.innerHTML = '<div style="text-align:center; padding:50px; font-family:sans-serif; color:red;"><h1>⚠️ تنبيه أمني خطير</h1><p>تم اكتشاف محاولة تلاعب في ساعة الجهاز (تأخير الوقت إلى الوراء).</p><p>الرجاء إعادة ضبط الوقت الحقيقي للجهاز ليعمل التطبيق بشكل طبيعي.</p></div>';
            throw new Error('Time tampering detected');
        }
    }
    if (!lastValidTime || deviceCurrentTime > Number(lastValidTime)) {
        localStorage.setItem('pos_last_trusted_time', deviceCurrentTime);
    }
}

function calculateExpiry(pkgStr, currentExpiryIso) {
    var d = currentExpiryIso && new Date(currentExpiryIso) > new Date() ? new Date(currentExpiryIso) : new Date();
    if(pkgStr.indexOf('تجربة 5 أيام') > -1) d.setDate(d.getDate() + 5);
    else if(pkgStr.indexOf('6 شهور') > -1) d.setMonth(d.getMonth() + 6);
    else if(pkgStr.indexOf('سنتين') > -1) d.setFullYear(d.getFullYear() + 2);
    else if(pkgStr.indexOf('سنة') > -1) d.setFullYear(d.getFullYear() + 1);
    else d.setFullYear(d.getFullYear() + 1);
    return d.toISOString();
}

window.initCloudSystem = function() {
    if (!window.fsDb || !navigator.onLine) {
        cloudMetadataLoaded = true;
        checkStoredSession();
        return;
    }
    var metaRef = window.fsDoc(window.fsDb, "system", "metadata");
    window.fsOnSnapshot(metaRef, function(docSnap) {
        if (docSnap.exists()) {
            var data = docSnap.data();
            usersList = Array.isArray(data.usersList) ? data.usersList : [];
            pendingRequests = Array.isArray(data.pendingRequests) ? data.pendingRequests : [];
            localStorage.setItem('pos_users_cache', JSON.stringify(usersList));
            localStorage.setItem('pos_pending_cache', JSON.stringify(pendingRequests));
        } else { usersList = []; pendingRequests = []; }
        cloudMetadataLoaded = true;
        checkStoredSession();
    }, function(err) {
        cloudMetadataLoaded = true;
        checkStoredSession();
    });
};

function checkStoredSession() {
    var sShop = localStorage.getItem('pos_current_shop');
    var sUser = localStorage.getItem('pos_current_user');
    var sRole = localStorage.getItem('pos_is_manager');
    if (sShop && sUser && !currentShop) {
        currentShop = sShop; 
        currentUser = sUser; 
        isManager = (sRole === 'true');
        startApp();
    }
}

function waitForCloudMetadata() {
    if (cloudMetadataLoaded) return Promise.resolve(true);
    return new Promise(function(resolve) { setTimeout(function(){ resolve(true); }, 1000); });
}

function saveCloudMetadata() {
    localStorage.setItem('pos_users_cache', JSON.stringify(usersList));
    localStorage.setItem('pos_pending_cache', JSON.stringify(pendingRequests));
    if (!window.fsDb || !navigator.onLine) return Promise.resolve();
    var metaRef = window.fsDoc(window.fsDb, "system", "metadata");
    return window.fsSetDoc(metaRef, { usersList: usersList, pendingRequests: pendingRequests, updatedAt: new Date().toISOString() }).catch(function(){});
}

async function doLogin() {
    checkDeviceTimeTampering();
    var u = document.getElementById('inpUser').value.trim().toLowerCase();
    var p = document.getElementById('inpPass').value.trim().toLowerCase();
    var msgBox = document.getElementById('loginMsg');
    if (u === '' || p === '') return msgBox.innerHTML = '<span style="color:#ffcccc;">الرجاء إدخال البيانات</span>';
    await waitForCloudMetadata();

    var foundManager = usersList.find(function(x) { return x.u.toLowerCase() === u && x.p.toLowerCase() === p; });
    if (foundManager) {
        if (foundManager.status === 'paused' || foundManager.disabled === true) {
            msgBox.innerHTML = '<span style="color:#ffcccc;">تم إيقاف هذا الحساب. يرجى التواصل مع خدمة العملاء 779282025.</span>';
            return;
        }
        if (foundManager.expiry && new Date(foundManager.expiry).getTime() < Date.now()) {
            msgBox.innerHTML = '<span style="color:#ffcccc;">انتهى الاشتراك. يرجى التواصل مع خدمة العملاء 779282025.</span>';
            return;
        }
        currentShop = foundManager.shop;
        currentUser = foundManager.u;
        isManager = true;
        localStorage.setItem('pos_current_shop', currentShop);
        localStorage.setItem('pos_current_user', currentUser);
        localStorage.setItem('pos_is_manager', 'true');
        startApp();
        return;
    }

    var localShopsKeys = Object.keys(localStorage);
    for(var i=0; i<localShopsKeys.length; i++) {
        if(localShopsKeys[i].indexOf('pos_db_') === 0) {
            try {
                var shopData = JSON.parse(localStorage.getItem(localShopsKeys[i]));
                if(shopData && shopData.workers) {
                    var worker = shopData.workers.find(function(w){ return w.u.toLowerCase() === u && w.p.toLowerCase() === p; });
                    if(worker) {
                        currentShop = shopData.shopName || localShopsKeys[i].replace('pos_db_', '');
                        currentUser = worker.u;
                        isManager = false;
                        localStorage.setItem('pos_current_shop', currentShop);
                        localStorage.setItem('pos_current_user', currentUser);
                        localStorage.setItem('pos_is_manager', 'false');
                        startApp();
                        return;
                    }
                }
            } catch(e){}
        }
    }

    msgBox.innerHTML = '<span style="color:#ffcccc;">بيانات الدخول غير صحيحة!</span>';
}

async function submitRequest() {
    var s = document.getElementById('regShop').value.trim();
    var u = document.getElementById('regUser').value.trim().toLowerCase();
    var p = document.getElementById('regPass').value.trim();
    var ph = document.getElementById('regPhone').value.trim();
    var pkg = document.getElementById('regPackage').value;
    
    if (!s || !u || !p || !ph) { alert('املأ جميع الحقول'); return; }
    
    var exists = usersList.find(function(x){ return x.u.toLowerCase() === u; });
    if(exists) { alert('اسم المدير هذا مستخدم مسبقاً، اختر اسماً فريداً آخر'); return; }

    if (pkg.indexOf('تجربة 5 أيام') > -1) {
        var req = { shop: s, u: u, p: p, phone: ph, package: pkg, expiry: calculateExpiry(pkg) };
        usersList.push(req);
        await saveCloudMetadata();
        alert('تم تفعيل الفترة التجريبية (5 أيام) بنجاح! يمكنك تسجيل الدخول الآن.');
        hideRegister();
    } else {
        var fileInput = document.getElementById('regReceipt').files[0];
        if (!fileInput) { alert('أرفق صورة سند الإيداع'); return; }
        
        var reader = new FileReader();
        reader.onload = async function(e) {
            var req = { shop: s, u: u, p: p, phone: ph, package: pkg, receipt: e.target.result };
            pendingRequests.push(req);
            await saveCloudMetadata();
            alert('تم إرسال طلب الاشتراك بنجاح للإدارة!');
            hideRegister();
        };
        reader.readAsDataURL(fileInput);
    }
}

function doLogout() {

function mergeLocalCloudData(localObj, cloudObj){
    var merged = Object.assign({}, cloudObj || {});
    Object.keys(localObj || {}).forEach(function(k){ if(!Array.isArray(localObj[k])) merged[k]=localObj[k]; });
    Object.keys(cloudObj || {}).forEach(function(k){ if(!Array.isArray(cloudObj[k])) merged[k]=cloudObj[k]; });
    var arrayKeys = {};
    Object.keys(localObj || {}).forEach(function(k){ if(Array.isArray(localObj[k])) arrayKeys[k]=true; });
    Object.keys(cloudObj || {}).forEach(function(k){ if(Array.isArray(cloudObj[k])) arrayKeys[k]=true; });
    Object.keys(arrayKeys).forEach(function(k){
        var result=[], seen={};
        function add(items){ (items||[]).forEach(function(item){
            var key;
            if(item && item.id!==undefined) key='id:'+String(item.id);
            else if(item && item.u!==undefined) key='u:'+String(item.u).toLowerCase();
            else if(item && item.name!==undefined) key='name:'+String(item.name).toLowerCase();
            else key='json:'+JSON.stringify(item);
            if(seen[key]===undefined){ seen[key]=result.length; result.push(item); }
            else if(item && typeof item==='object' && result[seen[key]] && typeof result[seen[key]]==='object') result[seen[key]]=Object.assign({},result[seen[key]],item);
        }); }
        add(cloudObj && cloudObj[k]); add(localObj && localObj[k]); merged[k]=result;
    });
    return merged;
}

function startApp() {
    checkDeviceTimeTampering();
    document.getElementById('VIEW_LOGIN').style.display = 'none';
    document.getElementById('VIEW_APP').style.display = 'block';
    document.getElementById('shopHeaderName').innerText = '🏪 ' + currentShop + (isManager ? ' (مدير)' : ' (عامل: ' + currentUser + ')');

    var localData = localStorage.getItem('pos_db_' + currentShop);

    if(!db) { db = { shopName: currentShop, products: [], sales: [], purchases: [], debts: [], payments: [], closedDays: [], cart: [], workers: [] }; }
    if(!db.workers) db.workers = [];
    if(!db.purchases) db.purchases = [];
    if(!db.payments) db.payments = [];
    if(!db.closedDays) db.closedDays = [];

                          '<button data-v="purchases" onclick="show(\'purchases\')">📦<br>المشتريات</button>' +
                          '<button data-v="accounts" onclick="show(\'accounts\')">👥<br>الحسابات</button>' +
                          '<button data-v="inventory" onclick="show(\'inventory\')">▦<br>المخزون</button>';
    } else {
        navEl.style.gridTemplateColumns = 'repeat(' + (3 + (hasWorkerPermission('addCustomer')?1:0) + (hasWorkerPermission('purchases')?1:0)) + ', minmax(0,1fr))';
        navEl.innerHTML = '<button data-v="home" onclick="show(\'home\')">⌂<br>الرئيسية</button>' +
                          '<button data-v="sale" onclick="openSaleModal()">🛒<br>بيع جديد</button>' +
                          '<button data-v="debts" onclick="show(\'debts\')">👤<br>الديون</button>' +
                          (hasWorkerPermission('addCustomer') ? '<button data-v="accounts" onclick="show(\'accounts\')">👥<br>إضافة عميل</button>' : '') +
                          (hasWorkerPermission('purchases') ? '<button data-v="purchases" onclick="show(\'purchases\')">📦<br>المشتريات</button>' : '');
    }

    if (window.fsDb && navigator.onLine) {
        if (unsubscribeShopListener) unsubscribeShopListener();
        var shopRef = window.fsDoc(window.fsDb, "shops", currentShop);
        var initialLocalData = localStorage.getItem('pos_db_' + currentShop);
        var initialLocalDb = null;
        try { if (initialLocalData) initialLocalDb = JSON.parse(initialLocalData); } catch(e) {}
        var initialCloudSyncHandled = false;
        unsubscribeShopListener = window.fsOnSnapshot(shopRef, function(docSnap) {
            if (docSnap.exists() && docSnap.data().dataJson) {
                // إذا كانت بيانات Firebase موجودة فهي المرجع الحالي وتُحمّل إلى ذاكرة الجهاز.
                var cloudDb = JSON.parse(docSnap.data().dataJson);
                // استرجاع آخر نسخة محلية محفوظة وقت وصول تحديث Firebase.
                var latestLocalDb = null;
                try {
                    var latestLocalRaw = localStorage.getItem('pos_db_' + currentShop);
                    if (latestLocalRaw) latestLocalDb = JSON.parse(latestLocalRaw);
                } catch(e) {}
                db = mergeLocalCloudData(latestLocalDb || initialLocalDb || {}, cloudDb || {});
                if (!db.purchases) db.purchases = [];
                if (!db.sales) db.sales = [];
                if (!db.debts) db.debts = [];
                if (!db.payments) db.payments = [];
                if (!db.closedDays) db.closedDays = [];
                if (!db.workers) db.workers = [];
                if (!db.cart) db.cart = [];
                localStorage.setItem('pos_db_' + currentShop, JSON.stringify(db));
                saveDailyShopSnapshot();
                var mergedJson = JSON.stringify(db);
                if (mergedJson !== docSnap.data().dataJson || localStorage.getItem(getShopSyncPendingKey(currentShop)) === '1') {
                    localStorage.setItem(getShopSyncPendingKey(currentShop), '1');
                    syncShopDataToCloud();
                }
            } else if (!initialCloudSyncHandled) {
                // عند غياب سجل المتجر في Firebase، ارفع البيانات المحفوظة محلياً أولاً.
                initialCloudSyncHandled = true;
                if (initialLocalDb && typeof initialLocalDb === 'object') {
                    db = initialLocalDb;
                    if (!db.purchases) db.purchases = [];
                    if (!db.sales) db.sales = [];
                    if (!db.debts) db.debts = [];
                    if (!db.payments) db.payments = [];
                    if (!db.closedDays) db.closedDays = [];
                    if (!db.workers) db.workers = [];
                    if (!db.cart) db.cart = [];
                    localStorage.setItem('pos_db_' + currentShop, JSON.stringify(db));
                    saveDailyShopSnapshot();
                    localStorage.setItem(getShopSyncPendingKey(currentShop), '1');
                    syncShopDataToCloud();
                }
            }
            var activeBtn = document.querySelector('.nav button.active');
            show(activeBtn ? activeBtn.dataset.v : 'home');
        }, function(err) {
            var activeBtn = document.querySelector('.nav button.active');
            show(activeBtn ? activeBtn.dataset.v : 'home');
        });
    } else {
        var activeBtn = document.querySelector('.nav button.active');
        show(activeBtn ? activeBtn.dataset.v : 'home');
    }
}


function saveDailyShopSnapshot() {
    if (!currentShop || !db) return;
    var dayKey = new Date().toISOString().slice(0,10);
    var key = 'pos_daily_backup_' + currentShop + '_' + dayKey;
    try {
        if (!localStorage.getItem(key)) {
            localStorage.setItem(key, JSON.stringify({ shop: currentShop, date: dayKey, savedAt: new Date().toISOString(), data: db }));
        }
    } catch (e) { console.warn('تعذر حفظ النسخة اليومية المحلية', e); }
}
function downloadDailyBackups() {
    var prefix = 'pos_daily_backup_' + currentShop + '_';
    var backups = [];
    Object.keys(localStorage).forEach(function(k) {
        if (k.indexOf(prefix) === 0) { try { backups.push(JSON.parse(localStorage.getItem(k))); } catch(e){} }
    });
    if (!backups.length) {
        backups.push({ shop: currentShop, date: new Date().toISOString().slice(0,10), savedAt: new Date().toISOString(), data: db });
    }
    var blob = new Blob([JSON.stringify({app:'Makhzani POS', exportedAt:new Date().toISOString(), backups:backups}, null, 2)], {type:'application/json;charset=utf-8'});
    var url = URL.createObjectURL(blob); var a = document.createElement('a');
    a.href = url; a.download = 'makhzani_daily_backups_' + currentShop + '_' + Date.now() + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('تم تنزيل ملف النسخ اليومية. احتفظ به خارج الجهاز أيضاً.');
}

// علامة دائمة على الجهاز توضح أن بيانات المحل تحتاج إلى رفع/مزامنة.
function getShopSyncPendingKey(shop){ return 'pos_sync_pending_' + String(shop || ''); }

function syncShopDataToCloud(){
    if (!currentShop || !db || !window.fsDb || !navigator.onLine) return Promise.resolve(false);
    var shopAtStart = currentShop;
    var shopRef = window.fsDoc(window.fsDb, "shops", shopAtStart);
    var payload = JSON.stringify(db);
    return window.fsSetDoc(shopRef, { dataJson: payload, updatedAt: new Date().toISOString() }).then(function(){
        // لا نمسح علامة الانتظار إن تغيرت البيانات أثناء الرفع.
        if (currentShop === shopAtStart && db && JSON.stringify(db) === payload) {
            localStorage.removeItem(getShopSyncPendingKey(shopAtStart));
            return true;
        }
        localStorage.setItem(getShopSyncPendingKey(shopAtStart), '1');
        return false;
    }).catch(function(err){
        localStorage.setItem(getShopSyncPendingKey(shopAtStart), '1');
        console.warn('Firebase save error:', err);
        toast('تعذر رفع البيانات إلى Firebase. ستبقى محفوظة على الجهاز وتُعاد المحاولة عند عودة الاتصال.');
        return false;
    });
}

function saveDB() {
    if (!currentShop || !db) return;
    db.shopName = currentShop;
    localStorage.setItem('pos_db_' + currentShop, JSON.stringify(db));
    saveDailyShopSnapshot();
    // احفظ حالة الانتظار أولاً، حتى لا تضيع عند انقطاع الإنترنت أو فشل الرفع.
    localStorage.setItem(getShopSyncPendingKey(currentShop), '1');
    if (!window.fsDb || !navigator.onLine) return Promise.resolve(false);
    return syncShopDataToCloud();
}

function getCurrencyCode(){ return (db && db.currency) || 'YER'; }
function getCurrencyLabel(){
    var labels = {YER:'ريال يمني (ر.ي)', SAR:'ريال سعودي (ر.س)', USD:'دولار أمريكي ($)'};
    return labels[getCurrencyCode()] || labels.YER;
}
function money(n){
    var code = getCurrencyCode();
    var locale = code === 'USD' ? 'en-US' : (code === 'SAR' ? 'ar-SA' : 'ar-YE');
    var symbol = code === 'SAR' ? ' ر.س' : (code === 'USD' ? ' $' : ' ر.ي');
    return Number(n||0).toLocaleString(locale, {maximumFractionDigits:2}) + symbol;
}
function changeCurrency(code){
    if(!db) return;
    if(['YER','SAR','USD'].indexOf(code) === -1) return;
    db.currency = code;
    saveDB();
    var activeBtn = document.querySelector('.nav button.active');
    show(activeBtn ? activeBtn.dataset.v : 'home');
    toast('تم تغيير العملة إلى ' + getCurrencyLabel());
}
function toast(s){
    var x = document.createElement('div'); x.className = 'toast'; x.textContent = s;
    document.body.appendChild(x); setTimeout(function(){ x.remove(); }, 1800);
}

function importBackupJSON(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var importedData = JSON.parse(e.target.result);
            if (importedData && importedData.products) {
                db = importedData;
                saveDB();
                show('home');
                alert('تم استعادة البيانات بنجاح!');
            } else {
                alert('ملف النسخة الاحتياطية غير صالح');
            }
        } catch(err) {
            alert('حدث خطأ أثناء قراءة الملف');
        }
    };
    reader.readAsText(file);
}

function closeDailyShift() {
    if(!isManager) return alert('إغلاق الوردية خاص بالمدير');
    var todayStr = new Date().toLocaleDateString();
    var todaySales = (db.sales || []).filter(function(s){ return new Date(s.date).toDateString() === new Date().toDateString(); });
    var todayPayments = (db.payments || []).filter(function(p){ return new Date(p.date).toDateString() === new Date().toDateString(); });

    if(todaySales.length === 0 && todayPayments.length === 0) {
        alert('لا توجد بيانات جديدة لترحيلها اليوم');
        return;
    }

    // Expected cash: cash sales plus debt collections received today.
    var programCashSales = todaySales.reduce(function(sum, sale){
        return sum + (sale.type === 'نقد' ? Number(sale.total || 0) : 0);
    }, 0);
    var debtCollections = todayPayments.reduce(function(sum, payment){
        return sum + Number(payment.amount || 0);
    }, 0);
    var expectedCash = programCashSales + debtCollections;
    var grossIncome = todaySales.reduce(function(sum, sale){
        return sum + Number(sale.total || 0);
    }, 0) + debtCollections;

    var actualCashInput = prompt(
        'مطابقة نهاية اليوم\n' +
        'مبيعات نقد البرنامج: ' + money(programCashSales) + '\n' +
        'تحصيلات الديون اليوم: ' + money(debtCollections) + '\n' +
        'المبلغ النقدي المتوقع بالصندوق: ' + money(expectedCash) + '\n\n' +
        'أدخل النقد الموجود فعلياً بالصندوق: '
    );
    if(actualCashInput === null) return;
    actualCashInput = actualCashInput.trim().replace(/,/g, '');
    if(actualCashInput === '' || !isFinite(Number(actualCashInput)) || Number(actualCashInput) < 0) {
        alert('أدخل مبلغاً نقدياً صحيحاً وغير سالب');
        return;
    }

    var actualCash = Number(actualCashInput);
    var shortage = Math.max(0, expectedCash - actualCash);
    var surplus = Math.max(0, actualCash - expectedCash);
    var confirmMessage = 'نتيجة مطابقة نهاية اليوم\n' +
        'الدخل الإجمالي المحفوظ: ' + money(grossIncome) + '\n' +
        'المتوقع نقداً: ' + money(expectedCash) + '\n' +
        'النقد الفعلي: ' + money(actualCash) + '\n' +
        (shortage > 0 ? '⚠️ النقص المسجل: ' + money(shortage) : (surplus > 0 ? 'الزيادة: ' + money(surplus) : '✅ الحساب مطابق')) +
        '\n\nهل تريد تأكيد إغلاق وترحيل اليوم؟';
    if(!confirm(confirmMessage)) return;

    var shiftSummary = {
        id: Date.now(), date: todayStr, sales: todaySales, payments: todayPayments,
        programCashSales: programCashSales, debtCollections: debtCollections,
        expectedCash: expectedCash, actualCash: actualCash, grossIncome: grossIncome,
        shortage: shortage, surplus: surplus,
        reconciliationStatus: shortage > 0 ? 'نقص' : (surplus > 0 ? 'زيادة' : 'مطابق')
    };

    if(!db.closedDays) db.closedDays = [];
    db.closedDays.push(shiftSummary);
    db.sales = (db.sales || []).filter(function(s){ return new Date(s.date).toDateString() !== new Date().toDateString(); });
    db.payments = (db.payments || []).filter(function(p){ return new Date(p.date).toDateString() !== new Date().toDateString(); });

    saveDB();
    show('home');
    toast(shortage > 0 ? 'تم إغلاق اليوم وتسجيل النقص: ' + money(shortage) : 'تم إغلاق اليوم وحفظ المطابقة والدخل الإجمالي');
}

// مزامنة أسماء العملاء تلقائياً من الحسابات القديمة والفواتير والسدادات
function syncAccountParties(){
 if(!db) return false;
 if(!Array.isArray(db.customers)) db.customers=[];
 if(!Array.isArray(db.suppliers)) db.suppliers=[];
 var changed=false;
 function addName(list,name){
  name=String(name||'').trim();
  if(!name || ['نقدي','زبون نقدي','زبون نقد'].indexOf(name.toLowerCase())!==-1) return;
  var exists=list.some(function(x){return String(x.name||'').trim().toLowerCase()===name.toLowerCase();});
  if(!exists){list.push({id:Date.now()+list.length,name:name,phone:''});changed=true;}
 }
 (db.sales||[]).forEach(function(x){if(x.customer && x.customer!=='نقدي')addName(db.customers,x.customer);});
 (db.debts||[]).forEach(function(x){addName(db.customers,x.customer);});
 (db.payments||[]).forEach(function(x){addName(db.customers,x.customer);});
 (db.salesReturns||[]).forEach(function(x){addName(db.customers,x.customer);});
 (db.purchases||[]).forEach(function(x){addName(db.suppliers,x.supplier);});
 (db.supplierReceipts||[]).forEach(function(x){addName(db.suppliers,x.supplier);});
 return changed;
}

function getAccountPartyNames(type){
 syncAccountParties();
 var list=type==='customer'?db.customers:db.suppliers;
 return (list||[]).map(function(x){return x.name;}).filter(Boolean);
}

function ensureSupplierAccount(name){
 var clean=String(name||'').trim();if(!clean)return null;
 if(!Array.isArray(db.suppliers))db.suppliers=[];
 var found=db.suppliers.find(function(x){return String(x.name||'').trim().toLocaleLowerCase()===clean.toLocaleLowerCase();});
 if(found)return found;
 var created={id:Date.now()+Math.floor(Math.random()*1000),name:clean,phone:''};db.suppliers.push(created);return created;
}
function addAccountParty(type){
 var name=prompt(type==='customer'?'اسم العميل الجديد':'اسم المورد الجديد'); if(!name||!name.trim())return;
 var key=type==='customer'?'customers':'suppliers'; if(!db[key])db[key]=[];
 if(db[key].some(function(x){return x.name.toLowerCase()===name.trim().toLowerCase();})){alert('الاسم مسجل مسبقاً');return;}
 db[key].push({id:Date.now(),name:name.trim(),phone:prompt('رقم الهاتف (اختياري)')||''});saveDB();show('accounts');toast('تمت إضافة '+(type==='customer'?'العميل':'المورد'));
}
function createSupplierReceipt(){
 var suppliers=(db.suppliers||[]).map(function(x){return x.name;});
 var name=prompt('اسم المورد المستلم للمبلغ:\\n'+(suppliers.length?'الموردون المسجلون: '+suppliers.join('، '):'لا يوجد موردون مسجلون'));
 if(!name||!name.trim())return;name=name.trim();
 var amount=Number(prompt('المبلغ المدفوع للمورد:',''));
 if(!isFinite(amount)||amount<=0){alert('أدخل مبلغاً صحيحاً أكبر من صفر');return;}
 var note=prompt('بيان السند (اختياري):','دفعة للمورد')||'دفعة للمورد';
 if(!db.supplierReceipts)db.supplierReceipts=[];
 if(!db.suppliers)db.suppliers=[];
 ensureSupplierAccount(name);
 var receiptNum='SUP-PAY-'+Date.now();
 db.supplierReceipts.push({id:Date.now(),num:receiptNum,supplier:name,amount:amount,note:note,date:new Date().toLocaleDateString(),createdAt:new Date().toISOString()});
 saveDB();show('purchases');
 toast('تم حفظ سند الدفع وخصم '+money(amount)+' من حساب المورد');
}

function accountBalance(type,name){
 if(type==='customer') return (db.debts||[]).filter(function(d){return String(d.customer||'').trim().toLowerCase()===String(name||'').trim().toLowerCase();}).reduce(function(a,d){return a+Number(d.remaining||0);},0);
 var normName=String(name||'').trim().toLocaleLowerCase();
 var purchasesTotal=(db.purchases||[]).filter(function(p){return String(p.supplier||'').trim().toLocaleLowerCase()===normName && (p.paymentType==='credit' || !p.paymentType);}).reduce(function(a,p){return a+Number(p.total||0);},0);
 return purchasesTotal-(db.supplierReceipts||[]).filter(function(r){return String(r.supplier||'').trim().toLocaleLowerCase()===normName;}).reduce(function(a,r){return a+Number(r.amount||0);},0);
}
function refreshStatementNames(){
 var type=document.getElementById('statementType').value;
 var select=document.getElementById('statementName');
 var names=getAccountPartyNames(type);
 select.innerHTML=names.map(function(n){return '<option>'+n+'</option>';}).join('');
 if(!names.length) select.innerHTML='<option value="">لا توجد أسماء مسجلة</option>';
}
function renderAccountStatement(){
 var type=document.getElementById('statementType').value,name=document.getElementById('statementName').value;
 var rows=[];
 if(type==='customer'){
  (db.sales||[]).filter(function(x){return x.customer===name;}).forEach(function(x){rows.push({date:x.date,detail:'فاتورة بيع '+(x.num||x.id||''),debit:Number(x.total||0),credit:0});});
  (db.payments||[]).filter(function(x){return x.customer===name;}).forEach(function(x){rows.push({date:x.date,detail:'سداد '+(x.note||''),debit:0,credit:Number(x.amount||0)});});
  (db.salesReturns||[]).filter(function(x){return x.customer===name;}).forEach(function(x){rows.push({date:x.date,detail:'مرتجع مبيعات • '+(x.item||''),debit:0,credit:Number(x.total||0)});});
 }else{
  (db.purchases||[]).filter(function(x){return String(x.supplier||'').trim().toLocaleLowerCase()===String(name||'').trim().toLocaleLowerCase();}).forEach(function(x){
   if(x.paymentType==='credit'||!x.paymentType) rows.push({date:x.date,detail:'فاتورة شراء آجلة '+(x.num||x.id||''),debit:0,credit:Number(x.total||0)});
   else rows.push({date:x.date,detail:'فاتورة شراء نقدية '+(x.num||x.id||''),debit:Number(x.total||0),credit:Number(x.total||0)});
  });
  (db.supplierReceipts||[]).filter(function(x){return String(x.supplier||'').trim().toLocaleLowerCase()===String(name||'').trim().toLocaleLowerCase();}).forEach(function(x){rows.push({date:x.createdAt||x.date,detail:'سند صرف '+(x.num||'')+' • '+(x.note||''),debit:Number(x.amount||0),credit:0});});
 }
 rows.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
 var totalDebit=0,totalCredit=0,balance=0,tbody='';
 rows.forEach(function(r,i){
  totalDebit+=r.debit;totalCredit+=r.credit;
  balance+=r.credit-r.debit;
  var dateText=(function(v){var d=new Date(v);return isNaN(d.getTime())?String(v||''):d.toLocaleDateString('en-CA');})(r.date);
  tbody+='<tr><td>'+dateText+'</td><td>'+r.detail+'</td><td class="red">'+(r.debit?money(r.debit):'0')+'</td><td class="green">'+(r.credit?money(r.credit):'0')+'</td><td class="green">'+money(balance)+'</td></tr>';
 });
 var balanceLabel=type==='customer'?(balance>=0?'رصيد مستحق على العميل':'رصيد للعميل'):(balance>=0?'رصيد مستحق للمورد':'رصيد للمؤسسة');
 var finalBalance=Math.abs(balance);
 var titleText='كشف حساب '+(type==='customer'?'عميل':'مورد')+' - '+name;
 var html='<div id="accountStatementPrint" style="background:#fff;color:#111;padding:12px;border:1px solid #ddd;margin-top:12px"><div style="text-align:center;font-weight:bold;color:#173caa;font-size:22px;margin-bottom:8px">'+titleText+'</div><div style="text-align:center;margin-bottom:12px">تاريخ الطباعة: '+new Date().toLocaleDateString('en-CA')+'</div><table style="width:100%;border-collapse:collapse;font-size:14px;direction:rtl"><thead><tr style="background:#dcdafa"><th style="border:1px solid #555;padding:7px">التاريخ</th><th style="border:1px solid #555;padding:7px">التفاصيل</th><th style="border:1px solid #555;padding:7px">عليه</th><th style="border:1px solid #555;padding:7px">له</th><th style="border:1px solid #555;padding:7px">الرصيد</th></tr></thead><tbody>'+tbody+'</tbody><tfoot><tr style="background:#e5e7eb;font-weight:bold"><td colspan="2" style="border:1px solid #555;padding:8px;text-align:center">إجمالي العمليات</td><td style="border:1px solid #555;padding:8px;color:#b91c1c">'+money(totalDebit)+'</td><td style="border:1px solid #555;padding:8px;color:#15803d">'+money(totalCredit)+'</td><td style="border:1px solid #555;padding:8px;color:#15803d">'+money(finalBalance)+'</td></tr></tfoot></table><div style="margin-top:12px;padding:10px;background:#b8f7a3;text-align:center;font-weight:bold">'+balanceLabel+': '+money(finalBalance)+'</div><div style="display:flex;justify-content:space-between;margin-top:16px"><span>التوقيع: __________</span><span>ختم: __________</span></div><div style="text-align:center;margin-top:12px"><button class="primary" onclick="exportAccountStatementPDF()">📄 إنشاء ومشاركة PDF (واتساب / Bluetooth)</button></div></div>';
 document.getElementById('statementResult').innerHTML=html||'<div class="card muted">لا توجد حركة لهذا الحساب</div>';
}
async function exportAccountStatementPDF(){
 var el=document.getElementById('accountStatementPrint');if(!el)return;
 if(typeof html2pdf==='undefined'){alert('تعذر إنشاء PDF؛ تحقق من اتصال الإنترنت ثم حاول مرة أخرى.');return;}
 var title=(el.querySelector('div')?.textContent||'كشف حساب').trim().replace(/[\\/:*?"<>|]/g,'_');
 var filename=title+'.pdf';
 var btn=el.querySelector('button');if(btn){btn.disabled=true;btn.textContent='جارٍ تجهيز PDF...';}
 try{
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  var clone=el.cloneNode(true);
  clone.querySelectorAll('button').forEach(function(b){b.remove();});
  // Inline computed styles on the cloned report so its PDF retains the on-screen look.
  var originals=[el].concat(Array.from(el.querySelectorAll('*')));
  var copies=[clone].concat(Array.from(clone.querySelectorAll('*')));
  originals.forEach(function(node,i){
   var copy=copies[i];if(!copy)return;
   try{var cs=window.getComputedStyle(node);for(var j=0;j<cs.length;j++){var prop=cs[j];copy.style.setProperty(prop,cs.getPropertyValue(prop),cs.getPropertyPriority(prop));}}catch(e){}

function formatStockQuantity(product) {
    var qty = Math.max(0, Number(product.qty || 0));
    var unit = String(product.packType || 'حبة');
    if(unit === 'حبة') return qty + ' حبة';
    var packSize = Math.max(1, Number(product.packSize || 1));
    var packs = Math.floor(qty / packSize);
    var remainder = qty % packSize;
    var packLabel = unit === 'كيس' ? 'كيس' : 'كرتون';
    var label = packs + ' ' + packLabel + ' (' + packSize + ' حبة لكل ' + packLabel + ')';
    if(remainder > 0) label += ' + ' + remainder + ' حبة';
    return label;
}

function renderStock(q) {
    var el = document.getElementById('stockList');
    if(!el) return;
    var terms = String(q || '').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    var html = '';
    for(var i=0; i<db.products.length; i++) {
        var p = db.products[i];
        var searchable=(String(p.name||'')+' '+String(p.barcode||'')).toLocaleLowerCase();
        var matchesAll=terms.every(function(term){return searchable.indexOf(term)!==-1;});
        if(!terms.length || matchesAll) {
            html += '<div class="product">';
            html += '<div style="flex:1;">';
            html += '<b>' + p.name + '</b>';
            if(isManager) {
                html += '<div class="muted">شراء: ' + money(p.buy) + ' | بيع: ' + money(p.sell) + ' | المخزون: <b>' + formatStockQuantity(p) + '</b></div>';
            } else {
                html += '<div class="muted">سعر البيع: ' + money(p.sell) + ' | المتبقي: <b style="color:#0f766e">' + formatStockQuantity(p) + '</b></div>';
            }
            html += '</div>';
            html += '<div style="display:flex; gap:6px; flex-wrap:wrap;">';
            if(isManager) {
                html += '<button class="light" style="padding:8px 10px;" onclick="editProductModal(' + p.id + ')">✏️ تعديل كامل</button>';
                html += '<button class="danger" style="padding:8px 10px;" onclick="deleteProduct(' + p.id + ')">🗑️</button>';
            } else {
                html += '<button class="light" style="padding:8px 10px;" onclick="quickEditProductStock(' + p.id + ')">✏️ تعديل السعر والكمية</button>';
            }
            html += '</div>';
            html += '</div>';
        }
    }
    el.innerHTML = html || '<div class="card muted">لا توجد منتجات مطابقة</div>';
}

function quickEditProductStock(id) {
    var p = (db.products || []).find(function(x){ return String(x.id) === String(id); });
    if(!p) return alert('المنتج غير موجود');
    var nextSell = prompt('سعر بيع الحبة للمنتج «' + p.name + '»:', String(Number(p.sell || 0)));
    if(nextSell === null) return;
    nextSell = Number(nextSell);
    if(!isFinite(nextSell) || nextSell < 0) return alert('أدخل سعر بيع صحيحاً');
    var nextPackSell = prompt('سعر بيع ' + (p.packType || 'الكرتون') + ':', String(Number(p.packSell || (p.sell || 0) * (p.packSize || 1))));
    if(nextPackSell === null) return;
    nextPackSell = Number(nextPackSell);
    if(!isFinite(nextPackSell) || nextPackSell < 0) return alert('أدخل سعر العبوة صحيحاً');
    var nextQty = prompt('الكمية الحالية في المخزون (بالحبات):', String(Number(p.qty || 0)));
    if(nextQty === null) return;
    nextQty = Number(nextQty);
    if(!isFinite(nextQty) || nextQty < 0) return alert('أدخل كمية صحيحة');
    var oldQty = Number(p.qty || 0);
    p.sell = nextSell;
    p.packSell = nextPackSell;
    p.qty = nextQty;
    if(!db.stockMovements) db.stockMovements = [];
    if(nextQty !== oldQty) db.stockMovements.push({id:Date.now(),date:new Date().toISOString(),kind:'تعديل مخزون',item:p.name,qty:nextQty-oldQty,reference:'MANUAL-'+Date.now(),worker:currentUser});

    renderStock('');
    toast('تم تحديث سعر البيع والكمية بنجاح');
}

function renderPurchaseCartRows() {
    if(!purchaseCart.length)return '<tr><td colspan="8" class="invoice-empty">أضف الأصناف إلى الفاتورة</td></tr>';
    return purchaseCart.map(function(item,i){
        return '<tr class="purchase-line"><td>'+(i+1)+'</td><td><input class="input grid-edit" list="purProductNamesList" value="'+escapeInvoiceText(item.name||'')+'" onchange="updatePurchaseRow('+i+',\'name\',this.value)"></td>'+
        '<td><select class="input grid-edit" onchange="updatePurchaseRow('+i+',\'unit\',this.value)"><option '+(item.unit==='حبة'?'selected':'')+'>حبة</option><option '+(item.unit==='كرتون'?'selected':'')+'>كرتون</option><option '+(item.unit==='كيس'?'selected':'')+'>كيس</option></select></td>'+
        '<td><input class="input grid-edit" type="number" min="0.01" step="any" value="'+Number(item.enteredQty||item.qty||0)+'" onchange="updatePurchaseRow('+i+',\'qty\',this.value)"></td>'+
        '<td><input class="input grid-edit" type="number" min="0" step="any" value="'+Number(item.cost||0)+'" onchange="updatePurchaseRow('+i+',\'cost\',this.value)"></td>'+
        '<td><input class="input grid-edit" type="number" min="0" step="any" value="'+Number(item.total||0)+'" onchange="updatePurchaseRow('+i+',\'total\',this.value)"></td>'+
        '<td><span>'+escapeInvoiceText(item.barcode||'—')+'</span></td><td><button class="danger invoice-delete" type="button" onclick="removePurchaseCartItem('+i+')">حذف</button></td></tr>';
    }).join('');
}
function updatePurchaseRow(index,field,value){
    var item=purchaseCart[index];if(!item)return;
    if(field==='name'){
        var found=(db.products||[]).find(function(p){return String(p.name||'').toLowerCase()===String(value||'').trim().toLowerCase();});
        if(!found){alert('اختر صنفاً مسجلاً أو أضفه من حقل الإضافة');refreshPurchaseCartContainer();return;}
        item.name=found.name;item.barcode=found.barcode||item.barcode||'';item.packSize=Math.max(1,Number(found.packSize||1));
    }else if(field==='unit'){
        // pieceCost هو سعر الحبة الأساسية؛ يبقى محفوظاً عند التنقل بين حبة/كيس/كرتون.
        if(!isFinite(Number(item.pieceCost))) item.pieceCost=Number(item.cost||0)/Math.max(1,Number(item.packSize||1));
        var productForUnit=findExistingPurchaseProduct(item.barcode||item.name,!!item.barcode);
        item.unit=value;
        item.packSize=value==='حبة'?1:Math.max(1,Number((productForUnit&&productForUnit.packSize)||item.savedPackSize||item.packSize||1));
        if(value!=='حبة') item.savedPackSize=item.packSize;
        item.cost=Number(item.pieceCost||0)*item.packSize;
    }else if(field==='qty'){
        var q=Number(value);if(!isFinite(q)||q<=0)return alert('الكمية غير صحيحة');item.enteredQty=q;
    }else if(field==='cost'){
        var c=Number(value);if(!isFinite(c)||c<0)return alert('السعر غير صحيح');item.cost=c;item.pieceCost=c/Math.max(1,Number(item.packSize||1));
    }else if(field==='total'){
        var t=Number(value),q2=Number(item.enteredQty||item.qty||1);if(!isFinite(t)||t<0||q2<=0)return alert('الإجمالي غير صحيح');item.cost=t/q2;item.pieceCost=item.cost/Math.max(1,Number(item.packSize||1));
    }
    item.qty=Number(item.enteredQty||0)*Math.max(1,Number(item.packSize||1));
    item.total=Number(item.cost||0)*Number(item.enteredQty||0);
    refreshPurchaseCartContainer();
}
function togglePurchasePackFields() {
    var unitEl=document.getElementById('purItemUnit');if(!unitEl)return;
    var unit=unitEl.value,packInput=document.getElementById('purItemPackSize');
    if(packInput)packInput.style.display=unit==='حبة'?'none':'block';
    var hint=document.getElementById('purPackHint');if(hint)hint.textContent=unit==='حبة'?'أدخل عدد الحبات المشتراة فقط.':'أدخل عدد الحبات داخل '+unit+' ثم عدد '+unit+' المشتراة.';
}
function setPurchaseEntryUnit(unit){
    var unitEl=document.getElementById('purItemUnit');if(unitEl)unitEl.value=unit;
    var nameEl=document.getElementById('purItemName'),barEl=document.getElementById('purItemBarcode');
    var product=findExistingPurchaseProduct(nameEl&&nameEl.value,false)||findExistingPurchaseProduct(barEl&&barEl.value,true);
    if(product){var size=Math.max(1,Number(product.packSize||1));var pack=document.getElementById('purItemPackSize');if(pack)pack.value=size;var cost=document.getElementById('purItemCost');if(cost)cost.value=Number(product.buy||0)*(unit==='حبة'?1:size);}
    togglePurchasePackFields();
}
function renderPurchaseProductSuggestions(query){
    var box=document.getElementById('purProductSuggestions');if(!box)return;var term=normalizePurchaseLookup(query);if(!term){box.style.display='none';box.innerHTML='';return;}
    var terms=term.split(/\s+/).filter(Boolean);
    var matches=(db.products||[]).filter(function(p){var searchable=normalizePurchaseLookup(String(p.name||'')+' '+String(p.barcode||''));return terms.every(function(t){return searchable.indexOf(t)!==-1;});});
    if(!matches.length){box.style.display='none';box.innerHTML='';return;}
    box.innerHTML=matches.map(function(p){var label=escapeInvoiceText(p.name||''),pack=String(p.packType||'حبة'),size=Math.max(1,Number(p.packSize||1));return '<button type="button" style="display:block;width:100%;text-align:right;padding:10px;border:0;border-bottom:1px solid #dbe3eb;background:#fff;color:#172b43" onclick="selectPurchaseProduct('+Number(p.id)+')"><b>'+label+'</b><small style="display:block;color:#64748b">'+escapeInvoiceText(p.barcode||'بدون باركود')+' • '+escapeInvoiceText(pack)+(pack==='حبة'?'':' / '+size+' حبة')+' • شراء '+money(p.buy||0)+'</small></button>';}).join('');box.style.display='block';
}
function selectPurchaseProduct(id){var product=(db.products||[]).find(function(p){return String(p.id)===String(id);});if(!product)return;applyPurchaseProductDefaults(product);var box=document.getElementById('purProductSuggestions');if(box){box.style.display='none';box.innerHTML='';}}
function normalizePurchaseLookup(value) {
    return String(value || '').trim().replace(/\\s+/g, ' ').toLocaleLowerCase();
}
function findExistingPurchaseProduct(value, byBarcode) {
    var normalized = normalizePurchaseLookup(value);
    if(!normalized) return null;
    var products = db.products || [];
    // Barcode lookup is exact first; never accidentally select a different product by partial text.
    if(byBarcode) {
        return products.find(function(p){ return normalizePurchaseLookup(p.barcode) === normalized; }) || null;
    }
    return products.find(function(p){ return normalizePurchaseLookup(p.name) === normalized; }) || null;
}
function applyPurchaseProductDefaults(product) {
    if(!product) return;
    var unitEl=document.getElementById('purItemUnit');
    var packEl=document.getElementById('purItemPackSize');
    var costEl=document.getElementById('purItemCost');
    var barcodeEl=document.getElementById('purItemBarcode');
    var nameEl=document.getElementById('purItemName');
    if(nameEl) nameEl.value=product.name || '';
    if(barcodeEl) barcodeEl.value=product.barcode || '';
    // Reuse the unit and package size previously saved for this product (including piece).
    var unit=(product.packType==='كيس'?'كيس':(product.packType==='كرتون'?'كرتون':'حبة'));
    if(unitEl) unitEl.value=unit;
    if(packEl) packEl.value=Math.max(1,Number(product.packSize||1));
    // buy is saved as price per base piece; convert it to the price of the selected purchase unit.
    if(costEl) costEl.value=Number(product.buy||0)*(unit==='حبة'?1:Math.max(1,Number(product.packSize||1)));
    togglePurchasePackFields();
    var hint=document.getElementById('purPackHint');
    if(hint) hint.textContent='تم استرجاع بيانات الصنف المحفوظة: الوحدة '+unit+(unit!=='حبة'?' • '+Math.max(1,Number(product.packSize||1))+' حبة في '+unit:'')+' • سعر الشراء المعبأ تلقائياً قابل للتعديل.';
}
function lookupPurchaseProductByName() {
    var input=document.getElementById('purItemName');var product=findExistingPurchaseProduct(input?input.value:'',false);
    if(product)applyPurchaseProductDefaults(product);renderPurchaseProductSuggestions(input?input.value:'');
}
function lookupPurchaseBarcodeIfFound(code) {
    var product=findExistingPurchaseProduct(code,true);
    if(product) applyPurchaseProductDefaults(product);
}
function lookupPurchaseBarcode(code) {
    code = String(code || '').trim();
    var product = findExistingPurchaseProduct(code,true);
    if(!product) { toast('الباركود غير مسجل في المخزون؛ أدخل اسم المنتج يدوياً'); return; }
    applyPurchaseProductDefaults(product);
    toast('تم العثور على المنتج: ' + product.name + ' • الوحدة والعبوة والسعر استُرجعت من الصنف المحفوظ');
}

function addPurchaseItemToList() {
    var name = document.getElementById('purItemName').value.trim();
    var barcode = document.getElementById('purItemBarcode').value.trim();
    var cost = Number(document.getElementById('purItemCost').value || 0);
    var qty = Number(document.getElementById('purItemQty').value || 0);
    var unit = document.getElementById('purItemUnit').value;
    var matchedProduct=findExistingPurchaseProduct(barcode,true)||findExistingPurchaseProduct(name,false);
    var packSize = unit === 'حبة' ? 1 : Math.max(1, Number(document.getElementById('purItemPackSize').value||(matchedProduct&&matchedProduct.packSize)||1));
    var baseQty = qty * packSize;
    if(!name || cost <= 0 || qty <= 0) { alert('أدخل بيانات صحيحة للصنف'); return; }
    purchaseCart.push({ name: name, barcode: barcode, cost: cost, pieceCost: cost / packSize, qty: baseQty, enteredQty: qty, unit: unit, packSize: packSize, savedPackSize: packSize, total: cost * qty });
    
    refreshPurchaseCartContainer();
    document.getElementById('purItemName').value = '';
    document.getElementById('purItemBarcode').value = '';
    document.getElementById('purItemCost').value = '';
    document.getElementById('purItemQty').value = '';
}

function removePurchaseCartItem(index) {
    purchaseCart.splice(index, 1);
    refreshPurchaseCartContainer();
}

function renderPurchaseCartRowsNormal(){
    if(!purchaseCart.length)return '<div class="muted" style="text-align:center;padding:14px">القائمة فارغة</div>';
    return purchaseCart.map(function(item,i){
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #e5e7eb"><span>'+escapeInvoiceText(item.name)+' ('+Number(item.enteredQty||item.qty||0)+' '+escapeInvoiceText(item.unit||'حبة')+') - '+money(item.total)+'</span><button class="danger" style="padding:5px 9px" onclick="removePurchaseCartItem('+i+')">حذف</button></div>';
    }).join('');
}
function refreshPurchaseCartContainer() {
    var box=document.getElementById('purItemsContainer');if(box)box.innerHTML=isDesktopInvoiceMode()?renderPurchaseCartRows():renderPurchaseCartRowsNormal();
    var count=document.getElementById('purItemCount');if(count)count.textContent=String(purchaseCart.length);
    var total=purchaseCart.reduce(function(a,x){return a+Number(x.total||0);},0);
    var grand=document.getElementById('purGrandTotal');if(grand)grand.value=total;
    var qty=document.getElementById('purQtyTotal');if(qty)qty.textContent=String(purchaseCart.reduce(function(a,x){return a+Number(x.enteredQty||x.qty||0);},0));
}
function setPurchaseGrandTotal(value){
    var desired=Number(value),current=purchaseCart.reduce(function(a,x){return a+Number(x.total||0);},0);
    if(!isFinite(desired)||desired<0||!purchaseCart.length){alert('أدخل إجمالياً صحيحاً بعد إضافة الأصناف');refreshPurchaseCartContainer();return;}
    var ratio=current>0?desired/current:0;
    purchaseCart.forEach(function(item){
        item.total=Number(item.total||0)*ratio;
        item.cost=Number(item.enteredQty||item.qty||1)>0?item.total/Number(item.enteredQty||item.qty||1):0;
    });
    refreshPurchaseCartContainer();
}
function savePurchaseInvoice(mode) {
    var purNum = document.getElementById('purNum').value.trim() || ('PUR-' + Date.now());
    var supplierName = document.getElementById('purSupplier').value.trim();
    if(purchaseCart.length === 0) { if(mode==='back'){closeModal();show('purchases');return;} alert('أضف أصنافاً للفاتورة أولاً'); return; }
    if(purchasePaymentType === 'credit' && !supplierName) { alert('عند اختيار الشراء الآجل، يجب كتابة اسم المورد حتى يُضاف المبلغ إلى حسابه'); document.getElementById('purSupplier').focus(); return; }
    var total = purchaseCart.reduce(function(acc, item){ return acc + item.total; }, 0);
    
    if(!db.purchases) db.purchases = [];

    if (editingPurchaseId) {
        var oldPur = db.purchases.find(function(x){ return x.id === editingPurchaseId; });
        if (oldPur) {
            for(var i=0; i<oldPur.items.length; i++) {
                var oldItem = oldPur.items[i];
                var prod = db.products.find(function(x){ return x.name.toLowerCase() === oldItem.name.toLowerCase(); });
                if(prod) prod.qty = Math.max(0, Number(prod.qty || 0) - Number(oldItem.qty || ((oldItem.enteredQty || 0) * (oldItem.packSize || 1))));
            }
        }
        db.purchases = db.purchases.filter(function(x){ return x.id !== editingPurchaseId; });
    }

    db.purchases.push({ id: editingPurchaseId || Date.now(), num: purNum, supplier: supplierName || '', paymentType: purchasePaymentType, date: new Date().toLocaleDateString(), items: purchaseCart, total: total });
    // كل مورد يذكر في فاتورة الشراء يُسجل تلقائياً في دليل الموردين، سواء كانت نقداً أو آجلاً.
    if(supplierName) ensureSupplierAccount(supplierName);
    
    if(!db.stockMovements) db.stockMovements = [];
    for(var i=0; i<purchaseCart.length; i++) {
        var p = purchaseCart[i];
        db.stockMovements.push({id:Date.now()+i, date:new Date().toISOString(), kind:'شراء', item:p.name, qty:Number(p.qty||0), reference:purNum, supplier:supplierName});
        var purchaseBarcode = String(p.barcode || '').trim().toLocaleLowerCase();
        var purchaseName = String(p.name || '').trim().toLocaleLowerCase();
        var existing = db.products.find(function(x){ return (purchaseBarcode && String(x.barcode||'').trim().toLocaleLowerCase() === purchaseBarcode) || String(x.name||'').trim().toLocaleLowerCase() === purchaseName; });
        if(existing) {
            existing.qty = Number(existing.qty || 0) + Number(p.qty || 0);
            existing.buy = isFinite(Number(p.pieceCost)) ? Number(p.pieceCost) : Number(p.cost || 0) / Math.max(1, Number(p.packSize||1));
            if(p.unit==='كرتون' || p.unit==='كيس' || p.unit==='حبة') {
                if(p.unit!=='حبة'){
                    existing.packType=p.unit;
                    existing.packSize=Math.max(1,Number(p.packSize||1));
                    existing.packSell=Number(existing.sell||0)*existing.packSize;
                }
            }
        } else {
            var newPackSize=p.unit==='حبة'?1:Math.max(1,Number(p.packSize||1));
            var newPieceBuy=isFinite(Number(p.pieceCost))?Number(p.pieceCost):Number(p.cost||0)/newPackSize;
            var newPieceSell=Math.round(newPieceBuy*1.2);
            db.products.push({ id: Date.now() + i, name: p.name, barcode: p.barcode || '', buy: newPieceBuy, sell: newPieceSell, qty: p.qty, packType: p.unit==='حبة'?'حبة':p.unit, packSize: newPackSize, packSell: Math.round(newPieceSell*newPackSize) });
        }
    }
    saveDB();
    closeModal();
    show('purchases');
    toast(mode==='back'?'تم حفظ فاتورة الشراء والعودة للقسم':(purchasePaymentType==='credit'?'تم حفظ الفاتورة الآجلة وإضافة المبلغ إلى حساب المورد':'تم حفظ فاتورة الشراء النقدية وترحيل الكميات إلى المخزون'));
}

function deletePurchaseInvoice(id) {
    if(!confirm('هل أنت متأكد من حذف فاتورة الشراء هذه؟ سيتم خصم الكميات المضافة من المخزون.')) return;
    var pur = (db.purchases || []).find(function(x){ return x.id === id; });
    if(pur) {
        for(var i=0; i<pur.items.length; i++) {
            var item = pur.items[i];
            var prod = db.products.find(function(x){ return x.name.toLowerCase() === item.name.toLowerCase(); });
            if(prod) prod.qty = Math.max(0, Number(prod.qty || 0) - Number(item.qty || ((item.enteredQty || 0) * (item.packSize || 1))));
        }
        db.purchases = db.purchases.filter(function(x){ return x.id !== id; });
        saveDB();
        show('purchases');
        toast('تم حذف الفاتورة وتحديث المخزون');
    }
}

function saleUnitOptions(product, currentUnit, cartIndex) {
    var units = ['حبة'];
    var customUnit = String(product.packType || '').trim();
    if(customUnit && customUnit !== 'حبة') units.push(customUnit);
    return units.map(function(unit) {
        var factor = unit === 'حبة' ? 1 : Math.max(1, Number(product.packSize || 1));
        var unitPrice = unit === 'حبة' ? Number(product.sell || 0) :
            Number(product.packSell || (Number(product.sell || 0) * factor));
        return '<option value="' + unit.replace(/"/g,'&quot;') + '" ' + (unit === currentUnit ? 'selected' : '') + '>' +
            unit + ' — ' + money(unitPrice) + (unit === 'حبة' ? '' : ' (' + factor + ' حبة)') + '</option>';
    }).join('');
}
